name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:


permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  HATTRICK_OAUTH_CONSUMER_KEY: dummy
  HATTRICK_OAUTH_CONSUMER_SECRET: dummy

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa  # v10.3.1
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        experimental: [false]
        include:
          - python-version: "3.15"
            experimental: true
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa  # v10.3.1
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pytest

  build:
    name: build wheel
    needs: [lint, test]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa  # v10.3.1
      - run: uv build
      - name: Check wheel metadata
        run: |
          unzip -p dist/*.whl '*/METADATA' | grep '^Requires-Python: >=3.11$'
      - name: Smoke-test the wheel in a clean environment
        run: |
          uv run --isolated --no-project --with dist/*.whl \
            python -c 'import ht_libs.get_flags, ht_libs.do_challenge, ht_libs.do_hattrick_request; print("wheel OK")'
      - uses: actions/upload-artifact@v4
        with:
          name: hattrick_libs-dist
          path: dist/
          if-no-files-found: error

  ci-ok:
    name: ci-ok
    if: always()
    needs: [lint, test, build]
    runs-on: ubuntu-latest
    steps:
      - name: All jobs green?
        run: |
          echo "lint=${{ needs.lint.result }} test=${{ needs.test.result }} build=${{ needs.build.result }}"
          test "${{ needs.lint.result }}" = success
          test "${{ needs.test.result }}" = success
          test "${{ needs.build.result }}" = success
