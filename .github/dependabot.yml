version: 2
updates:
  # Python deps: SECURITY updates only.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      timezone: "Europe/Zurich"
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"
