[project]
name = "hattrick_libs"
version = "0.21.0"
description = "A library for hattrick.org data"
dependencies = [
    "beautifulsoup4>=4.13",
    "lxml>=6.1.3",
    "requests-oauthlib>=2.0",
]
readme = "README.md"
requires-python = ">= 3.11"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ruff>=0.1.9",
    "mypy>=1.8.0",
    "pre-commit>=3.5.0",
    "pytest>=9.1.1",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
        packages = ["ht_libs"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "PL", "PERF", "BLE", "RUF"]
allowed-confusables = ["’"]

[tool.ruff.lint.per-file-ignores]
# magic numbers and == "" are fine (and clearer) in test asserts
"tests/**" = ["PLR2004", "PLC1901"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]
